<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LineSkip Pass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
  <script src="gsap.min.js"></script>

  <!-- 🔹 PWA + iOS support -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#111925">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LineSkip">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>

  <!-- Screen content (everything above the tab bar) -->
  <main class="app">

    <!-- Top header: title + live date -->
    <header class="topbar">
      <h1>My Passes</h1>
      <span class="topbar-date" id="headerDate">—</span>
    </header>

    <!-- Pass Card -->
    <section class="card" id="passCard">
      <div class="card-top">
        <div>
          <div class="venue">Lion's Den</div>
          <h2 class="brand">LineSkip (Fri)</h2>
        </div>
        <span class="qty">Qty: 2</span>
      </div>

      <div class="qr">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=LineSkipPass"
          alt="QR Code"/>
      </div>

      <div class="details">
        <div class="detail">
          <div class="label">Passholder</div>
          <div class="value">Seth Khammassi</div>
        </div>
        <div class="detail right">
          <div class="label">Expires at</div>
          <!-- ✅ JS will fill this with "Sep 16, 4:00 AM" -->
          <div class="value" id="expiresAt">—</div>
        </div>
      </div>
    </section>

    <!-- Bottom section: instruction + buttons + dot -->
    <section class="bottom-section" id="bottomSection">
      <p class="note">
        Show doorman pass to redeem.<br />
        Only doorman should redeem.
      </p>

      <button class="btn btn-gray" id="openSheetBtn">I am the bartender or venue staff</button>
      <button class="btn btn-blue" id="howBtn">How to redeem this pass</button>

      <div class="pager-dot" aria-hidden="true"></div>
    </section>
  </main>

  <!-- Bottom Navigation with your icons -->
  <nav class="tabs" role="navigation" aria-label="Main">
    <a class="tab" href="#" aria-label="Venues">
      <img src="VENUES.jpeg" alt="" />
      <span>Venues</span>
    </a>
    <a class="tab active" href="#" aria-current="page" aria-label="My Passes">
      <img src="mY PASSES.jpeg" alt="" />
      <span>My Passes</span>
    </a>
    <a class="tab" href="#" aria-label="Drops">
      <img src="dROPS.jpeg" alt="" />
      <span>Drops</span>
    </a>
    <a class="tab" href="#" aria-label="Account">
      <img src="aCCOUNT.jpeg" alt="" />
      <span>Account</span>
    </a>
  </nav>

  <!-- ===== Slide-up staff redeem sheet (full height, like the app) ===== -->
  <div class="backdrop" id="backdrop"></div>
  <aside class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="Staff redeem">
    <div class="sheet-handle"></div>

    <!-- circular logo (uses venueLogo.png if present, otherwise shows text fallback) -->
    <div class="logo-wrap">
      <img class="logo-img" src="venueLogo.png" alt="Champs logo"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <div class="logo-fallback">Champs</div>
    </div>

    <div class="sheet-card">
      <div class="qr-big">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=Redeem"
          alt="Redeem QR"/>
      </div>
      <p class="current-time">
        <span>Current time</span><br />
        <strong id="liveTime">—</strong>
      </p>
    </div>

    <!-- scanner lane with moving vertical line + emojis -->
    <div class="scanner">
      <div class="scan-line"></div>
      <div class="icons">
        <span>🍄</span>
        <span>🍤</span>
      </div>
    </div>

    <p class="warn">⚠️ This action cannot be undone</p>

    <button class="btn btn-blue" id="redeemBtn">Redeem</button>
    <button class="btn btn-ghost" id="cancelSheetBtn">Cancel</button>
  </aside>

  <!-- ===== Fullscreen animation overlay ===== -->
  <section class="anim-screen" id="animScreen" aria-hidden="true">
    <div class="anim-stage">
      <svg id="checkIcon" viewBox="0 0 52 52" class="check">
        <circle id="checkCircle" cx="26" cy="26" r="24" fill="none" stroke="white" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="151" stroke-dashoffset="151"
                transform="rotate(-90 26 26)"/>
        <path id="checkTick" d="M14 27 L22 35 L38 18" stroke="white" stroke-width="4" fill="none"
              stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="35" stroke-dashoffset="35"/>
      </svg>

      <!-- check shatters into these pieces, then they become the LL mark -->
      <div id="fragments" class="fragments" style="display:none;">
        <span class="frag"></span><span class="frag"></span><span class="frag"></span>
        <span class="frag"></span><span class="frag"></span><span class="frag"></span>
      </div>

      <!-- LL mark drawn as SVG so it sits clean (no box) on the dark screen -->
      <svg id="llLogo" viewBox="10 -4 110 100" class="ll-logo" style="display:none;" role="img" aria-label="LL logo">
        <g transform="skewX(-12)" fill="#fff">
          <path id="llLeft"  d="M30 4 h24 v50 h24 v20 h-48 Z"/>
          <path id="llRight" d="M86 18 h24 v50 h24 v20 h-48 Z"/>
        </g>
      </svg>
    </div>

    <div class="tagline" id="tagline">Fun, Faster.</div>
  </section>

  <!-- “No Passes” state after redeem (tab bar stays visible) -->
  <section id="noPasses" class="empty" style="display:none;">
    <header class="topbar">
      <h1>My Passes</h1>
      <span class="topbar-date" id="headerDate2">—</span>
    </header>

    <div class="empty-middle">
      <svg class="empty-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="14" y="24" width="36" height="26" rx="7"
              fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 3"/>
        <path d="M24 24 v-3 a8 8 0 0 1 16 0 v3"
              fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 3"/>
      </svg>
      <p>You Have No Passes</p>
    </div>

    <button id="buyBtn" class="btn btn-blue btn-stacked">
      <span class="btn-title">Buy Another Pass</span>
      <span class="btn-sub">from Champs Downtown</span>
    </button>
  </section>

  <script src="script.js"></script>

  <!-- 🔹 Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js")
        .catch(err => console.warn("SW failed", err));
    }
  </script>
</body>
</html>
